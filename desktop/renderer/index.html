<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gideon Listener</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="logo">◒</span>
      <span class="name">Gideon</span>
    </div>
    <select id="mode" class="mode">
      <option value="thought_plot">Thought Plot</option>
      <option value="architect">Architecture</option>
      <option value="argument_ref">Debate</option>
    </select>
    <div class="spacer"></div>
    <button id="pin" class="icon-btn on" title="Float on top">⇧</button>
  </header>

  <main class="stage">
    <div id="map" class="map"></div>
    <div id="empty" class="empty">
      <div class="empty-orb">◒</div>
      <p id="empty-text">Press <b>Listen</b> and start talking. Your thinking becomes a live map.</p>
      <p id="interim" class="interim"></p>
    </div>
  </main>

  <section id="rail" class="rail hidden">
    <div id="flags" class="flags"></div>
    <div id="transcript" class="transcript"></div>
  </section>

  <footer class="dock">
    <button id="listen" class="listen">
      <span class="mic-dot"></span>
      <span id="listen-label">Listen</span>
    </button>
    <div id="status" class="status">Ready</div>
    <button id="toggle-rail" class="icon-btn" title="Notes">☰</button>
  </footer>

  <script src="mermaid.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
