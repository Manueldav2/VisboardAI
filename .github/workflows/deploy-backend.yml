name: Deploy Backend to Heroku

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Push the backend/ subdir to Heroku's git over HTTPS with the API key.
      # (The heroku-deploy action fights the current Heroku CLI, and runners no
      # longer ship the CLI — this needs neither.)
      - name: Deploy backend to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          cd backend
          git init -q
          git config user.email "ci@github"
          git config user.name "github-actions"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA}"
          git push -f "https://heroku:${HEROKU_API_KEY}@git.heroku.com/thought-plot-backend.git" HEAD:main
